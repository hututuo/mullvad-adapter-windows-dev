[package]
name = "mullvad-pq-negotiator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22.0"
hyper-util = { version = "0.1.8", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
talpid-tunnel-config-client = { git = "https://github.com/mullvad/mullvadvpn-app.git", rev = "19fb87407f4b81fe15372c2c7f8a20e7ab4eb220" }
talpid-types = { git = "https://github.com/mullvad/mullvadvpn-app.git", rev = "19fb87407f4b81fe15372c2c7f8a20e7ab4eb220" }
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tonic = "0.14.6"
tower = { version = "0.5.1", features = ["util"] }
