[package]
name = "mullvad-quic-carrier"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-only"

[dependencies]
libc = "0.2"
mullvad-masque-proxy = { git = "https://github.com/mullvad/mullvadvpn-app.git", rev = "19fb87407f4b81fe15372c2c7f8a20e7ab4eb220" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Networking_WinSock"] }
