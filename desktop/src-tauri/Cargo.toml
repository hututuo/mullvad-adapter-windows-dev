[package]
name = "mullvad-adapter-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
adapter-protocol = { path = "../../core/crates/protocol" }
adapter-platform = { path = "../../core/crates/platform" }
adapter-clash-integration = { path = "../../core/crates/clash-integration" }
adapter-control = { path = "../../core/crates/control" }
adapter-domain = { path = "../../core/crates/domain" }
adapter-engine-mihomo = { path = "../../core/crates/engine-mihomo" }

serde_json = "=1.0.152"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
