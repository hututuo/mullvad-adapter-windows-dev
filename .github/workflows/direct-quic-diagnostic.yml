name: direct-quic-diagnostic
on:
  push:
    branches: ['test/windows-direct-quic-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-component:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_HOME: 'D:\c'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Allow long upstream source paths on disposable runner
        run: git config --global core.longpaths true
      - name: Test isolated component
        run: cargo test --manifest-path tools/official-quic-bridge/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Build isolated component
        run: cargo build --manifest-path tools/official-quic-bridge/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
      - name: Verify closed failure and prepare component receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin='tools/official-quic-bridge/target/x86_64-pc-windows-msvc/release/adapter-quic-diagnostic.exe'
          $si=[Diagnostics.ProcessStartInfo]::new((Resolve-Path $bin).Path)
          $si.UseShellExecute=$false; $si.RedirectStandardInput=$true; $si.RedirectStandardOutput=$true; $si.RedirectStandardError=$true
          $proc=[Diagnostics.Process]::Start($si)
          $proc.StandardInput.Write('{}'); $proc.StandardInput.Close()
          $stdout=$proc.StandardOutput.ReadToEndAsync(); $stderr=$proc.StandardError.ReadToEndAsync()
          if (!$proc.WaitForExit(5000)) { $proc.Kill(); throw 'closed input deadline' }
          if ($proc.ExitCode -ne 2 -or !$stderr.Wait(1000) -or !$stdout.Wait(1000) -or $stderr.Result -notmatch 'input_invalid' -or $stdout.Result.Length -ne 0) { throw 'closed input rejection failed' }
          $proc.Dispose()
          New-Item -ItemType Directory -Path component | Out-Null
          Copy-Item $bin component/
          Copy-Item tools/official-quic-bridge/README.md,tools/official-quic-bridge/Cargo.lock,LICENSE component/
          $file=Get-Item $bin
          [ordered]@{schema=1;kind='diagnostic_component';version='0.0.0';source_sha=$env:GITHUB_SHA;upstream_sha='19fb87407f4b81fe15372c2c7f8a20e7ab4eb220';run_id=$env:GITHUB_RUN_ID;platform='windows';architecture='x86_64';filename=$file.Name;size=$file.Length;sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower();signing='NOT_RUN';native_unit_tests='PASS';real_quic='NOT_RUN';real_wireguard='NOT_RUN';installer='NOT_RUN'} | ConvertTo-Json | Set-Content component/component.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-direct-quic-${{ github.sha }}
          path: component/
          if-no-files-found: error
          retention-days: 7
