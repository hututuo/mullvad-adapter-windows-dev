[workspace]
members = ["crates/domain", "crates/protocol", "crates/control", "crates/agent", "crates/platform", "crates/engine-mihomo", "crates/catalogue", "crates/probe", "crates/history", "crates/mullvad-api", "crates/clash-integration"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
adapter-platform = { path = "crates/platform" }
adapter-domain = { path = "crates/domain" }
adapter-protocol = { path = "crates/protocol" }
adapter-control = { path = "crates/control" }
adapter-mullvad-api = { path = "crates/mullvad-api" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
